name: CI

on:
  push:
    branches: [ master, develop ]
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  pull_request:
    branches: [ master, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run unit tests
        run: npm run test:unit

      - name: Build project for production
        run: NODE_ENV=production npm run build

      - name: Build docs
        run: npm run build:docs

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: ./dist
          retention-days: 1

  # The RLS policies and grants are the entire security boundary: the browser talks to
  # PostgREST directly with the user's JWT, so nothing in the client enforces ownership.
  # These two suites are what check that, and until now they were run by hand.
  #
  # Independent of build-and-test on purpose — it needs no bundle, and booting the stack
  # is the slow part, so there is no reason to serialise it behind anything.
  supabase-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Applies supabase/migrations and supabase/seed.sql on the way up, so the schema
      # under test is the one in the repo.
      #
      # gotrue is deliberately NOT excluded: the suites insert fixtures into auth.users
      # and call auth.uid(), so the auth schema has to exist. The rest of the list is
      # only there to skip containers no psql test touches — it is an optimisation, not a
      # requirement, so if `start` ever misbehaves the honest fix is to drop the -x flag
      # rather than to bisect the list. kong/postgrest/postgres-meta are left in because
      # they are small and sit closest to the CLI's own readiness checks.
      - name: Start Supabase
        run: >
          npx supabase start
          -x studio,imgproxy,edge-runtime,logflare,vector,mailpit,supavisor,realtime,storage-api

      # Asked for rather than hardcoded, so a port change in config.toml cannot leave this
      # job pointing at nothing. The credentials are the CLI's fixed local defaults and
      # the database is thrown away with the runner, so there is nothing here to protect.
      - name: Resolve the database URL
        run: |
          url=$(npx supabase status -o env | sed -n 's/^DB_URL=//p' | tr -d '"')
          if [ -z "$url" ]; then
            echo "::error::supabase status did not report a DB_URL"
            npx supabase status || true
            exit 1
          fi
          echo "DATABASE_URL=$url" >> "$GITHUB_ENV"

      - name: Verify row level security, quotas and grants
        run: |
          failed=0
          for suite in supabase/tests/*.sql; do
            echo "::group::$suite"
            output=$(psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "$suite" 2>&1) && status=0 || status=$?
            echo "$output"
            echo "::endgroup::"

            if [ "$status" -ne 0 ]; then
              echo "::error file=$suite::$suite failed - see the log group above"
              failed=1
            elif ! printf '%s' "$output" | grep -q 'ALL CHECKS PASSED'; then
              # ON_ERROR_STOP catches a raised assertion, but not a script that ends early
              # without reaching its final notice. Require the notice as well.
              echo "::error file=$suite::$suite did not reach its final assertion"
              failed=1
            else
              echo "$suite: ALL CHECKS PASSED"
            fi
          done
          exit $failed

      # Diagnostics only — must never turn a green run red, or mask the real failure.
      - name: Collect Supabase diagnostics
        if: failure()
        continue-on-error: true
        run: |
          npx supabase status || true
          docker ps -a || true

  e2e-tests:
    runs-on: ubuntu-latest
    needs: build-and-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: chromium
            timeout: 25
          - project: firefox
            timeout: 25
          - project: webkit
            timeout: 40

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browser
        run: npx playwright install --with-deps ${{ matrix.project }}

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: ./dist

      - name: Create test output directory
        run: mkdir -p e2e/test-output

      - name: Run e2e tests
        run: npx playwright test --project=${{ matrix.project }}
        timeout-minutes: ${{ matrix.timeout }}

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 7

      - name: Upload Playwright test results (screenshots, videos, traces)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results-${{ matrix.project }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  deploy:
    runs-on: ubuntu-latest
    needs: [build-and-test, e2e-tests]
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: ./dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist
          enable_jekyll: false
          force_orphan: true
          cname: editor.keyboard-tools.xyz
